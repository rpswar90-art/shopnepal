<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNepal - Categories</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f2f4f8;
        color: #333;
    }

    /* HEADER */
    header {
        background: #ffffff;
        padding: 18px 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
        color: #0066ff;
    }

    nav a {
        margin: 0 18px;
        text-decoration: none;
        color: #444;
        font-weight: 600;
        transition: 0.3s;
    }

    nav a:hover {
        color: #0066ff;
    }

    .search-cart input {
        padding: 10px 15px;
        border-radius: 25px;
        border: 1px solid #ccc;
        margin-right: 15px;
        width: 200px;
    }

    /* BANNER */
    .banner {
        background: url('https://cdn.pixabay.com/photo/2016/11/29/09/32/shopping-1866163_1280.jpg');
        background-size: cover;
        background-position: center;
        height: 45vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        position: relative;
    }

    .banner::after {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.45);
    }

    .banner h1 {
        position: relative;
        z-index: 2;
        font-size: 48px;
        font-weight: 700;
    }

    /* CATEGORY SECTION */
    .categories {
        padding: 60px 50px;
        text-align: center;
    }

    .categories h2 {
        font-size: 36px;
        margin-bottom: 30px;
        color: #222;
    }

    .cat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
    }

    .cat-card {
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
        transition: 0.3s;
        cursor: pointer;
    }

    .cat-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .cat-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 12px;
    }

    .cat-card h3 {
        margin-top: 12px;
        font-size: 20px;
        color: #333;
    }

    /* FOOTER */
    footer {
        background: #1f1f1f;
        color: white;
        padding: 35px;
        text-align: center;
        margin-top: 40px;
        font-size: 16px;
    }

    /* RESPONSIVE */
    @media (max-width: 992px) {
        .cat-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        .cat-grid {
            grid-template-columns: repeat(1, 1fr);
        }
        .banner h1 { font-size: 32px; }
    }
</style>
</head>
<body>

<header>
    <div class="logo">ShopNepal</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="search-cart">
        <input type="text" placeholder="Search categories...">
        🛒
    </div>
</header>

<!-- BANNER -->
<div class="banner">
    <h1>Our Categories</h1>
</div>

<!-- CATEGORY GRID -->
<section class="categories">
    <h2>Browse Categories</h2>

    <div class="cat-grid">

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2016/11/29/04/17/headphones-1868612_1280.jpg">
            <h3>Electronics</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2016/03/27/21/16/bag-1283865_1280.jpg">
            <h3>Accessories</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2016/03/27/22/22/phone-case-1283875_1280.jpg">
            <h3>Mobile Items</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2017/01/06/19/15/tripod-1951072_1280.jpg">
            <h3>Photography</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2016/11/29/04/17/keyboard-1868611_1280.jpg">
            <h3>Computer Parts</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2017/01/06/19/15/power-bank-1951071_1280.jpg">
            <h3>Power & Charging</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2016/11/29/04/17/earphones-1868613_1280.jpg">
            <h3>Audio Devices</h3>
        </div>

        <div class="cat-card">
            <img src="https://cdn.pixabay.com/photo/2016/11/29/04/17/lamp-1868614_1280.jpg">
            <h3>Home & Lighting</h3>
        </div>

    </div>
</section>

<!-- FOOTER -->
<footer>
    © 2026 ShopNepal — All Rights Reserved
</footer>

</body>
</html>
