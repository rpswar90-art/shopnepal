<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopNepal - Contact Us</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f2f4f8;
        color: #333;
    }

    /* HEADER */
    header {
        background: #ffffff;
        padding: 18px 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
        color: #0066ff;
    }

    nav a {
        margin: 0 18px;
        text-decoration: none;
        color: #444;
        font-weight: 600;
        transition: 0.3s;
    }

    nav a:hover {
        color: #0066ff;
    }

    .search-cart input {
        padding: 10px 15px;
        border-radius: 25px;
        border: 1px solid #ccc;
        margin-right: 15px;
        width: 200px;
    }

    /* BANNER */
    .banner {
        background: url('https://cdn.pixabay.com/photo/2016/11/29/09/32/shopping-1866163_1280.jpg');
        background-size: cover;
        background-position: center;
        height: 40vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        position: relative;
    }

    .banner::after {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.45);
    }

    .banner h1 {
        position: relative;
        z-index: 2;
        font-size: 48px;
        font-weight: 700;
    }

    /* CONTACT SECTION */
    .contact-section {
        padding: 60px 50px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }

    .contact-info {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .contact-info h2 {
        font-size: 32px;
        margin-bottom: 15px;
        color: #222;
    }

    .info-card {
        background: #f9fafc;
        padding: 18px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .info-card h3 {
        margin-bottom: 5px;
        color: #0066ff;
    }

    .info-card p {
        margin: 0;
        color: #555;
    }

    /* FORM */
    .contact-form {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .contact-form h2 {
        font-size: 32px;
        margin-bottom: 15px;
        color: #222;
    }

    .contact-form input,
    .contact-form textarea {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .contact-form button {
        padding: 12px 25px;
        background: #0066ff;
        border: none;
        border-radius: 25px;
        color: white;
        font-size: 18px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s;
    }

    .contact-form button:hover {
        background: #004ecc;
    }

    /* MAP */
    .map {
        margin: 50px;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    iframe {
        width: 100%;
        height: 350px;
        border: none;
    }

    /* FOOTER */
    footer {
        background: #1f1f1f;
        color: white;
        padding: 35px;
        text-align: center;
        margin-top: 40px;
        font-size: 16px;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
        .contact-section {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 600px) {
        .banner h1 { font-size: 32px; }
    }
</style>
</head>
<body>

<header>
    <div class="logo">ShopNepal</div>
    <nav>
        <a href="home.html">Home</a>
        <a href="products.html">Products</a>
        <a href="categories.html">Categories</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="search-cart">
        <input type="text" placeholder="Search...">
        🛒
    </div>
</header>

<!-- BANNER -->
<div class="banner">
    <h1>Contact Us</h1>
</div>

<!-- CONTACT SECTION -->
<section class="contact-section">

    <!-- CONTACT INFO -->
    <div class="contact-info">
        <h2>Get in Touch</h2>

        <div class="info-card">
            <h3>📍 Address</h3>
            <p>Kathmandu, Nepal</p>
        </div>

        <div class="info-card">
            <h3>📞 Phone</h3>
            <p>+977 9800000000</p>
        </div>

        <div class="info-card">
            <h3>📧 Email</h3>
            <p>support@shopnepal.com</p>
        </div>

        <div class="info-card">
            <h3>⏰ Working Hours</h3>
            <p>Sun–Fri: 9 AM – 6 PM</p>
        </div>
    </div>

    <!-- CONTACT FORM -->
    <div class="contact-form">
        <h2>Send a Message</h2>

        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <input type="text" placeholder="Subject">
        <textarea rows="6" placeholder="Your Message and what you need"></textarea>

        <button>Send Message</button>
    </div>

</section>

<!-- MAP -->
<div class="map">
    <iframe src="https://maps.google.com/maps?q=Kathmandu&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</div>

<!-- FOOTER -->
<footer>
    © 2026 ShopNepal — All Rights Reserved
</footer>

</body>
</html>
