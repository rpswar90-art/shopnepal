<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="0; url=login.html">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
    }

    .box {
        width: 380px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.20);
        backdrop-filter: blur(12px);
        border-radius: 15px;
        text-align: center;
        color: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .box h2 {
        font-size: 30px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .box input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        outline: none;
    }

    /* LOGIN BUTTON NORMAL */
    #loginBtn {
        width: 100%;
        padding: 12px;
        background: gray;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 18px;
        cursor: not-allowed;
        margin-top: 10px;
        transition: 0.3s;
    }

    /* LOGIN BUTTON ACTIVE */
    #loginBtn.active {
        background: #007bff;
        cursor: pointer;
    }

    #loginBtn.active:hover {
        background: #005fcc;
    }

    .links {
        margin-top: 15px;
        font-size: 15px;
    }

    .links a {
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        display: block;
        margin-top: 8px;
        transition: 0.3s;
    }

    .links a:hover {
        color: #cce0ff;
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="box">
    <h2>Login</h2>

    <input type="text" id="email" placeholder="Email or Username">
    <input type="password" id="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <div class="links">
        <a href="#">Forgot Password?</a>
        <a href="#">Create New Account</a>
    </div>
</div>

<script>
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");

    function checkInput() {
        if (email.value.trim() !== "" && password.value.trim() !== "") {
            loginBtn.classList.add("active");
            loginBtn.onclick = () => {
                window.location.href = "home.html"; // Go to home page
            };
        } else {
            loginBtn.classList.remove("active");
            loginBtn.onclick = null;
        }
    }

    email.addEventListener("input", checkInput);
    password.addEventListener("input", checkInput);
</script>

</body>
</html>
